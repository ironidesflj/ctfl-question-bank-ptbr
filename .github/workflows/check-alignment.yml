name: Check PT/EN alignment

on:
  push:
    paths:
      - "ctfl-questions-ptbr.json"
      - "synapse-question-bank.json"
      - "build_bank.py"
      - "add_en.py"
      - "check_alignment.py"
      - "check_alignment*baseline*.json"
      - "verify_sync.py"
      - "test_sync_protection.py"
      - "test_editorial_batch.py"
      - "apply_editorial_batch.py"
      - "editorial/*.json"
      - "axon/*.json"
      - "verify_axon_ids.py"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "ctfl-questions-ptbr.json"
      - "synapse-question-bank.json"
      - "build_bank.py"
      - "add_en.py"
      - "check_alignment.py"
      - "check_alignment*baseline*.json"
      - "verify_sync.py"
      - "test_sync_protection.py"
      - "test_editorial_batch.py"
      - "apply_editorial_batch.py"
      - "editorial/*.json"
      - "axon/*.json"
      - "verify_axon_ids.py"
      - ".github/workflows/*.yml"

jobs:
  check-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test synchronization protections
        run: python3 -m unittest test_sync_protection.py test_editorial_batch.py
      - name: Validate reserved Axon IDs
        run: python3 verify_axon_ids.py
      - name: Check legacy bank
        run: python3 check_alignment.py --bank-file ctfl-questions-ptbr.json --threshold 0
      - name: Check synapse-question-bank.json (threshold 0; inconclusivos em allowlist explícita)
        run: python3 check_alignment.py --bank-file synapse-question-bank.json --threshold 0
