name: Sync validated question bank to ctfl-app

on:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "check_alignment.py"
      - "verify_sync.py"
      - "test_sync_protection.py"
      - "test_editorial_batch.py"
      - "apply_editorial_batch.py"
      - "editorial/*.json"
      - ".github/workflows/sync-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-bank-to-app
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bank
      - uses: actions/checkout@v4
        with:
          repository: ironidesflj/ctfl-app
          token: ${{ secrets.CTFL_APP_SYNC_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test sync protections
        working-directory: bank
        run: python3 -m unittest test_sync_protection.py test_editorial_batch.py
      - name: Reject downgrade and live metadata loss before copying
        run: python3 bank/verify_sync.py bank app --check-current
      - name: Block sync on canonical quality failures
        working-directory: bank
        run: |
          python3 check_alignment.py --bank-file ctfl-questions-ptbr.json --threshold 0
          python3 check_alignment.py --bank-file synapse-question-bank.json --threshold 0
      - name: Copy canonical files and regenerate derived slices
        run: |
          cp bank/ctfl-questions-ptbr.json app/src/data/ctfl-questions-ptbr.json
          cp bank/synapse-question-bank.json app/src/data/synapse-question-bank.json
          cd app
          node scripts/split-bank.mjs
      - name: Enforce checksums and full slice equality
        run: python3 bank/verify_sync.py bank app
      - name: Verify app regression
        working-directory: app
        run: |
          npm ci
          npm run test -- --maxWorkers=4
          npm run build
      - name: Open reviewed sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CTFL_APP_SYNC_TOKEN }}
          path: app
          branch: sync/validated-bank
          title: "sync: banco canônico validado"
          body: |
            Fonte: ironidesflj/ctfl-question-bank-ptbr@${{ github.sha }}.
            Guardas canônicas com threshold zero, anti-downgrade,
            checksums e fatias completas validados antes de abrir este PR.
            Revisão e merge manuais obrigatórios; sem auto-merge.
          commit-message: "sync: reconcile validated canonical bank and derived slices"
